name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Web Assets
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Task.apk
          echo "APK successfully built:"
          ls -lh dist-apk/Task.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Task-Android-APK
          path: dist-apk/Task.apk
          retention-days: 30

      - name: Add Job Summary
        run: |
          echo "### 🚀 Android APK 打包成功！" >> $GITHUB_STEP_SUMMARY
          echo "已成功生成可直接安装的 Android APK 安装包：" >> $GITHUB_STEP_SUMMARY
          echo "- **应用名称**: Task" >> $GITHUB_STEP_SUMMARY
          echo "- **包名**: com.taskflow.app" >> $GITHUB_STEP_SUMMARY
          echo "- **下载位置**: 请在当前 Action 运行页面的最下方 **Artifacts（构建产物）** 区域点击下载 **Task-Android-APK**（解压即可得到 \`Task.apk\`）" >> $GITHUB_STEP_SUMMARY
