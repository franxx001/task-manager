name: Supabase Keep Alive

# 每天发一次真实数据库查询，防止 Supabase 免费层因 7 天无活动被暂停。
# 说明：必须查真实表（产生 DB 活动），不能只 ping 根域名/health 端点。

on:
  schedule:
    # 每 5 天 UTC 01:30 = 北京时间 09:30（避开整点高峰）
    # 注意：不能用 */6 —— 2 月没有 25 号，*/6 会停在 19 号，19→次月1号空窗 10-11 天，
    # 超过 7 天暂停阈值。*/5 最大空窗仅 6 天，留足余量。
    - cron: '30 1 */5 * *'
  workflow_dispatch: {}   # 支持手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (real table query)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $status"
          echo "Response body: $(cat /tmp/resp.json)"
          if [ "$status" != "200" ]; then
            echo "::error::Keepalive request failed (status=$status)"
            exit 1
          fi
          echo "✅ Keepalive OK"
